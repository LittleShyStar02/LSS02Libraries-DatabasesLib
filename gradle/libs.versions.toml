[versions]
config-core = "0.1.3-beta.4"
mybatis = "3.5.19"
hikaricp = "7.1.0"
slf4j = "2.0.17"
flyway = "13.12.2"
h2 = "2.5.252"
postgresql = "42.7.14"
mariadb = "4.0.0"
mysql = "26.10.0"
sqlite = "3.49.1.0"
lombok = "1.18.38"
junit = "6.1.3"
mockito = "5.22.0"
testcontainers = "2.0.5"
vanniktech-publish = "0.37.0"

[libraries]
config-core = { module = "io.github.littleshystar02:config-core", version.ref = "config-core" }
mybatis = { module = "org.mybatis:mybatis", version.ref = "mybatis" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-mysql = { module = "org.flywaydb:flyway-mysql", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
mariadb-client = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
mysql-connector = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }

[plugins]
vanniktech-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech-publish" }
